bEnablePreferredInputAPIPreferences=False
DefaultPreferredInputAPIList=
; 2026-09-15 用户实机:球能开(WASD 正常)但视角"死活拖不动"。
; 引擎源码 EngineBaseTypes.h 的官方注释:
;   CapturePermanently                        = 点击视口后永久捕获,并**吞掉**那次用来捕获的按下;
;   CapturePermanently_IncludingInitialMouseDown = 同上,但**把那次按下也送给玩家输入**。
; 两者都要求"先点一下游戏视口"才会捕获;捕获一旦丢失(Alt+Tab / Esc / 打开菜单或设置界面 /
; 点了编辑器面板),必须**再点一次视口**才恢复 —— 键盘不受影响,所以表现为"WASD 能用、拖鼠标没反应"。
; 这里选 CapturePermanently:重新捕获用的那一下点击不再触发游戏内 LMB 动作(更干净)。
; (PIE 里尤其要注意这点;打包运行时 bCaptureMouseOnLaunch=True 会在启动时直接捕获。)
DefaultViewportMouseCaptureMode=CapturePermanently
DefaultViewportMouseLockMode=LockOnCapture
FOVScale=0.011110
DoubleClickTime=0.200000
DeprecatedActionAndAxisNames=()
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
DefaultTouchInterface=/Engine/MobileResources/HUD/DefaultVirtualJoysticks.DefaultVirtualJoysticks
-ConsoleKeys=Tilde
+ConsoleKeys=Tilde

