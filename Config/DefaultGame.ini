[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=z-flip
ProjectVersion=5.0.0

; 这台机器上运行的 ZenServer 没有注册 /prj/ 路由(项目创建一律 404 "No suitable route found"),
; 而 BaseGame.ini 默认 bUseZenStore=True 会让 UAT 给 cooker 加 -ZenStore,于是 cook 阶段必崩在
; ZenStoreWriter.cpp "Failed to delete oplog on the ZenServer"。关掉它,走文件版 cooked output,
; 只影响 cook 的中间产物缓存,不影响打出来的包。
[/Script/UnrealEd.ProjectPackagingSettings]
bUseZenStore=False
; 2026-10-11: 碎裂资产(GeometryCollection)由 UGSBreakableComponent 按"网格名约定"在运行时
; 用字符串路径 LoadObject 加载 —— cooker 看不见这种引用,之前打出来的包里没有 Fracture/*
; ⇒ 破坏物只隐藏、不出碎块(编辑器 PIE 看不出来)。把约定目录显式加入 cook。
+DirectoriesToAlwaysCook=(Path="/Game/GravityShift/Fracture")
; 2026-10-11 收尾:明确 cook 地图清单(命令行上的 -allmaps 实测不会把 MainMenu 带进包,
; 且此清单是官方推荐做法)。Main 里挂着 Level1-6 的流式子关,会随 Main 一起进包;
; MainMenu 是打包入口图(GameDefaultMap)。白盒 Re_Blockout 等测试图不再进包。
+MapsToCook=(FilePath="/Game/Maps/Main")
+MapsToCook=(FilePath="/Game/Menus/LEVELS/MainMenu")
; 2026-10-11 收尾:菜单引用了 Content/Menus/movies/movies.mp4(WmfMedia 播放)。
; 非资产文件默认只有 Content/Movies 目录会自动 stage;这个目录要显式声明,否则包里
; 没有 mp4,菜单加载时报 "Failed to validate media source screen"。(路径相对 Content)
+DirectoriesToAlwaysStageAsNonUFS=(Path="Menus/movies")

